# Базовая конфигурация. Для разработки автоматически подхватывается
# docker-compose.override.yml (dev-режим).

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379

services:
  db:
    # Именно Debian-образ (не alpine): том с данными создан им, смена libc ломает collation
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый сервис: применяет миграции и завершается
  migrate:
    build:
      context: ./backend
      target: prod
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment: *app-env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
