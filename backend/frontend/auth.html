<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRUCE — LOGIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Inter', Arial, sans-serif; min-height: 100vh; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .form-input { background: transparent; border: 1px solid rgba(255,255,255,.15); color: #fff; width: 100%; padding: .75rem 1rem; font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; outline: none; transition: border-color .2s; }
    .form-input:focus { border-color: #FF0000; }
    .form-input::placeholder { color: rgba(255,255,255,.25); }
    .btn-red { background: #FF0000; color: #fff; border: 2px solid #FF0000; padding: .875rem 2rem; font-size: .75rem; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; cursor: pointer; width: 100%; transition: background .2s, color .2s; }
    .btn-red:hover { background: transparent; color: #FF0000; }
    .tab-active { border-bottom: 2px solid #FF0000; color: #fff; }
    .tab-inactive { border-bottom: 2px solid transparent; color: rgba(255,255,255,.3); }
  </style>
</head>
<body class="flex flex-col min-h-screen">

<nav class="border-b border-white/10 px-4 h-16 flex items-center justify-between">
  <a href="/frontend/index.html" class="text-2xl font-black tracking-[.2em] uppercase">DRUCE</a>
  <a href="/frontend/index.html" class="text-xs font-black tracking-widest uppercase text-white/40 hover:text-white transition-colors">← BACK</a>
</nav>

<div class="flex-1 flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-sm" style="animation: fadeIn .5s ease">

    <div class="mb-10 text-center">
      <p class="text-red text-xs font-black tracking-[.4em] uppercase mb-3">Members</p>
      <h1 class="text-4xl font-black uppercase tracking-tight">ACCESS</h1>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-white/10 mb-8">
      <button id="tab-login" onclick="switchTab('login')" class="tab-active flex-1 pb-3 text-xs font-black tracking-widest uppercase transition-all">LOGIN</button>
      <button id="tab-register" onclick="switchTab('register')" class="tab-inactive flex-1 pb-3 text-xs font-black tracking-widest uppercase transition-all">REGISTER</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="flex flex-col gap-4">
      <input type="email" id="login-email" placeholder="Email" class="form-input" required />
      <input type="password" id="login-password" placeholder="Password" class="form-input" required />
      <p id="login-error" class="text-red text-xs font-bold tracking-widest uppercase hidden"></p>
      <button type="submit" class="btn-red mt-2">ENTER</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" onsubmit="handleRegister(event)" class="flex flex-col gap-4 hidden">
      <input type="email" id="reg-email" placeholder="Email" class="form-input" required />
      <input type="password" id="reg-password" placeholder="Password" class="form-input" required minlength="6" />
      <input type="password" id="reg-confirm" placeholder="Confirm Password" class="form-input" required />
      <p id="reg-error" class="text-red text-xs font-bold tracking-widest uppercase hidden"></p>
      <p id="reg-success" class="text-xs font-bold tracking-widest uppercase hidden" style="color:#4ade80"></p>
      <button type="submit" class="btn-red mt-2">CREATE ACCOUNT</button>
    </form>

  </div>
</div>

<script src="/frontend/js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = '/frontend/index.html';

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('login-form').classList.toggle('hidden', !isLogin);
    document.getElementById('register-form').classList.toggle('hidden', isLogin);
    document.getElementById('tab-login').className = `${isLogin ? 'tab-active' : 'tab-inactive'} flex-1 pb-3 text-xs font-black tracking-widest uppercase transition-all`;
    document.getElementById('tab-register').className = `${!isLogin ? 'tab-active' : 'tab-inactive'} flex-1 pb-3 text-xs font-black tracking-widest uppercase transition-all`;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.classList.add('hidden');
    try {
      const data = await api.auth.login(email, password);
      Auth.setUser({ email });
      window.location.href = '/frontend/index.html';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;
    const errEl = document.getElementById('reg-error');
    const sucEl = document.getElementById('reg-success');
    errEl.classList.add('hidden');
    sucEl.classList.add('hidden');

    if (password !== confirm) {
      errEl.textContent = 'Passwords do not match';
      errEl.classList.remove('hidden');
      return;
    }
    try {
      await api.auth.register(email, password);
      sucEl.textContent = '✓ Account created — logging in...';
      sucEl.classList.remove('hidden');
      await api.auth.login(email, password);
      Auth.setUser({ email });
      window.location.href = '/frontend/index.html';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    }
  }
</script>
</body>
</html>
