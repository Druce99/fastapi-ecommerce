<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRUCE — FROM THE ENDS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { red: { DEFAULT: '#FF0000' } },
          fontFamily: { sans: ['Inter', 'Arial', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Inter', Arial, sans-serif; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    .product-card:hover .product-img { transform: scale(1.05); }
    .product-card:hover .card-overlay { opacity: 1; }
    .product-img { transition: transform .5s ease; }
    .card-overlay { opacity: 0; transition: opacity .3s ease; }

    .marquee-track { animation: marquee 18s linear infinite; }
    .marquee-track:hover { animation-play-state: paused; }

    .nav-link { position: relative; }
    .nav-link::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px; background: #FF0000; transition: width .3s ease; }
    .nav-link:hover::after { width: 100%; }

    .btn-red { background: #FF0000; color: #fff; border: 2px solid #FF0000; transition: background .2s, color .2s; }
    .btn-red:hover { background: transparent; color: #FF0000; }
    .btn-outline { background: transparent; color: #fff; border: 2px solid #fff; transition: background .2s, color .2s; }
    .btn-outline:hover { background: #fff; color: #0a0a0a; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #FF0000; }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════ NAV -->
<nav class="fixed top-0 left-0 right-0 z-50 border-b border-white/10" style="background: rgba(10,10,10,.95); backdrop-filter: blur(10px);">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
    <a href="/frontend/index.html" class="text-2xl font-black tracking-[.2em] uppercase text-white">DRUCE</a>

    <div class="hidden md:flex items-center gap-8">
      <a href="/frontend/index.html" class="nav-link text-xs font-bold tracking-widest uppercase text-white/70 hover:text-white transition-colors">Home</a>
      <a href="/frontend/index.html#catalog" class="nav-link text-xs font-bold tracking-widest uppercase text-white/70 hover:text-white transition-colors">Shop</a>
    </div>

    <div class="flex items-center gap-5">
      <a href="/frontend/cart.html" class="relative text-white/70 hover:text-white transition-colors">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span id="cart-badge" class="hidden absolute -top-2 -right-2 w-4 h-4 bg-red text-white text-[10px] font-black rounded-full items-center justify-center">0</span>
      </a>
      <div id="auth-area"></div>
    </div>
  </div>
</nav>

<!-- ═══════════════════════════════════════════════ HERO -->
<section class="min-h-screen flex flex-col justify-end pb-20 px-4 relative overflow-hidden pt-16">
  <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-[#0a0a0a] z-10"></div>
  <div class="absolute inset-0 opacity-5" style="background-image: repeating-linear-gradient(0deg, #fff 0, #fff 1px, transparent 1px, transparent 60px), repeating-linear-gradient(90deg, #fff 0, #fff 1px, transparent 1px, transparent 60px);"></div>

  <div class="max-w-7xl mx-auto w-full relative z-20">
    <p class="text-red text-xs font-black tracking-[.4em] uppercase mb-4">London, UK — Est. 2024</p>
    <h1 class="text-[clamp(4rem,15vw,14rem)] font-black leading-none tracking-tight uppercase text-white mb-4">DRUCE</h1>
    <p class="text-white/40 text-sm font-bold tracking-[.5em] uppercase mb-10">FROM THE ENDS</p>
    <div class="flex flex-wrap gap-4">
      <a href="#catalog" class="btn-red px-8 py-3 text-xs font-black tracking-widest uppercase">SHOP NOW</a>
      <a href="#catalog" class="btn-outline px-8 py-3 text-xs font-black tracking-widest uppercase">VIEW ALL</a>
    </div>
  </div>
</section>

<!-- ═══════════════════════════════════════════════ MARQUEE -->
<div class="overflow-hidden border-y border-white/10 py-3 bg-red">
  <div class="marquee-track flex gap-16 whitespace-nowrap w-max">
    <span class="text-xs font-black tracking-[.3em] uppercase text-white" id="marquee-1"></span>
    <span class="text-xs font-black tracking-[.3em] uppercase text-white" id="marquee-2"></span>
  </div>
</div>

<!-- ═══════════════════════════════════════════════ CATEGORIES -->
<section class="max-w-7xl mx-auto px-4 py-16">
  <p class="text-red text-xs font-black tracking-[.4em] uppercase mb-2">Browse</p>
  <h2 class="text-4xl font-black uppercase tracking-tight mb-10">Categories</h2>
  <div id="categories-grid" class="flex flex-wrap gap-3"></div>
</section>

<!-- ═══════════════════════════════════════════════ CATALOG -->
<section id="catalog" class="max-w-7xl mx-auto px-4 pb-24">
  <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-4">
    <div>
      <p class="text-red text-xs font-black tracking-[.4em] uppercase mb-2">All Products</p>
      <h2 class="text-4xl font-black uppercase tracking-tight">The Collection</h2>
    </div>
    <div class="flex gap-3 items-center">
      <input id="search-input" type="text" placeholder="SEARCH..." class="bg-transparent border border-white/20 text-white placeholder-white/30 text-xs font-bold tracking-widest uppercase px-4 py-2 focus:outline-none focus:border-red transition-colors w-48" />
      <select id="sort-select" class="bg-[#0a0a0a] border border-white/20 text-white text-xs font-bold tracking-widest uppercase px-4 py-2 focus:outline-none focus:border-red transition-colors">
        <option value="">SORT BY</option>
        <option value="price_asc">PRICE: LOW</option>
        <option value="price_desc">PRICE: HIGH</option>
      </select>
    </div>
  </div>

  <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

  <div id="load-more-wrap" class="flex justify-center mt-12 hidden">
    <button id="load-more-btn" class="btn-outline px-10 py-3 text-xs font-black tracking-widest uppercase">LOAD MORE</button>
  </div>

  <div id="products-empty" class="hidden text-center py-24">
    <p class="text-white/20 text-6xl font-black uppercase tracking-tight mb-4">0</p>
    <p class="text-white/40 text-xs font-bold tracking-widest uppercase">No products found</p>
  </div>
</section>

<!-- ═══════════════════════════════════════════════ FOOTER -->
<footer class="border-t border-white/10 py-12 px-4">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start gap-8">
    <div>
      <p class="text-3xl font-black tracking-[.2em] uppercase mb-2">DRUCE</p>
      <p class="text-white/30 text-xs font-bold tracking-widest uppercase">From The Ends</p>
    </div>
    <div class="text-white/20 text-xs font-bold tracking-widest uppercase">
      © 2024 DRUCE. All rights reserved.
    </div>
  </div>
</footer>

<script src="/frontend/js/api.js"></script>
<script>
  // ─── State ────────────────────────────────────────────────────────────────
  let currentPage = 1;
  const PAGE_SIZE = 12;
  let currentCategory = null;
  let currentSearch = '';
  let totalProducts = 0;
  let searchTimer = null;

  // ─── Init ─────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    renderAuthArea();
    updateCartBadge();
    loadCategories();
    loadProducts(true);
    initMarquee();
  });

  // ─── Auth area ────────────────────────────────────────────────────────────
  function renderAuthArea() {
    const area = document.getElementById('auth-area');
    if (Auth.isLoggedIn()) {
      const user = Auth.getUser();
      area.innerHTML = `
        <div class="flex items-center gap-4">
          <a href="/frontend/profile.html" class="text-xs font-black tracking-widest uppercase text-white/70 hover:text-white transition-colors">${user?.email?.split('@')[0] || 'ACCOUNT'}</a>
          <button onclick="api.auth.logout()" class="text-xs font-black tracking-widest uppercase text-white/30 hover:text-red transition-colors">EXIT</button>
        </div>`;
    } else {
      area.innerHTML = `<a href="/frontend/auth.html" class="btn-red px-5 py-2 text-xs font-black tracking-widest uppercase">LOGIN</a>`;
    }
  }

  // ─── Marquee ──────────────────────────────────────────────────────────────
  function initMarquee() {
    const text = '★ DRUCE ★ FROM THE ENDS ★ LONDON ★ STREETWEAR ★ NEW DROP ★ ';
    const full = text.repeat(6);
    document.getElementById('marquee-1').textContent = full;
    document.getElementById('marquee-2').textContent = full;
  }

  // ─── Categories ───────────────────────────────────────────────────────────
  async function loadCategories() {
    try {
      const cats = await api.categories.getAll();
      const grid = document.getElementById('categories-grid');

      const allBtn = createCategoryBtn('ALL', null, true);
      grid.appendChild(allBtn);

      cats.forEach(cat => {
        grid.appendChild(createCategoryBtn(cat.name, cat.id, false));
      });
    } catch (e) {}
  }

  function createCategoryBtn(label, id, active) {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.dataset.id = id || '';
    btn.className = `px-5 py-2 text-xs font-black tracking-widest uppercase border transition-colors ${
      active ? 'bg-white text-[#0a0a0a] border-white' : 'bg-transparent text-white/60 border-white/20 hover:border-white hover:text-white'
    }`;
    btn.addEventListener('click', () => {
      currentCategory = id;
      currentPage = 1;
      document.querySelectorAll('#categories-grid button').forEach(b => {
        b.className = 'px-5 py-2 text-xs font-black tracking-widest uppercase border transition-colors bg-transparent text-white/60 border-white/20 hover:border-white hover:text-white';
      });
      btn.className = 'px-5 py-2 text-xs font-black tracking-widest uppercase border transition-colors bg-white text-[#0a0a0a] border-white';
      loadProducts(true);
    });
    return btn;
  }

  // ─── Products ─────────────────────────────────────────────────────────────
  async function loadProducts(reset = false) {
    if (reset) {
      currentPage = 1;
      document.getElementById('products-grid').innerHTML = '';
    }

    const params = { page: currentPage, page_size: PAGE_SIZE };
    if (currentCategory) params.category_id = currentCategory;
    if (currentSearch) params.search = currentSearch;

    try {
      const data = await api.products.getAll(params);
      totalProducts = data.total;
      renderProducts(data.items, reset);
      updateLoadMore(data.total);
    } catch (e) {
      document.getElementById('products-empty').classList.remove('hidden');
    }
  }

  function renderProducts(products, reset) {
    const grid = document.getElementById('products-grid');
    const empty = document.getElementById('products-empty');

    if (reset) grid.innerHTML = '';

    if (!products.length && reset) {
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    products.forEach(p => {
      const card = document.createElement('a');
      card.href = `/frontend/product.html?id=${p.id}`;
      card.className = 'product-card block group cursor-pointer';
      card.style.animation = 'fadeIn .4s ease forwards';

      const img = p.image_url
        ? `<img src="${imageUrl(p.image_url)}" alt="${p.name}" class="product-img w-full h-full object-cover" />`
        : `<div class="w-full h-full flex items-center justify-center"><span class="text-white/10 text-6xl font-black uppercase">${p.name[0]}</span></div>`;

      card.innerHTML = `
        <div class="relative overflow-hidden bg-[#111] aspect-[3/4] mb-3">
          ${img}
          <div class="card-overlay absolute inset-0 bg-black/60 flex items-center justify-center">
            <span class="text-white text-xs font-black tracking-widest uppercase border border-white px-4 py-2">VIEW</span>
          </div>
          ${p.stock === 0 ? '<div class="absolute top-3 left-3 bg-white/10 text-white/50 text-[10px] font-black tracking-widest uppercase px-2 py-1">SOLD OUT</div>' : ''}
          ${p.stock > 0 && p.stock <= 5 ? '<div class="absolute top-3 left-3 bg-red text-white text-[10px] font-black tracking-widest uppercase px-2 py-1">LOW STOCK</div>' : ''}
        </div>
        <p class="text-[10px] font-black tracking-widest uppercase text-white/40 mb-1">${p.category_id ? '' : ''}</p>
        <p class="text-sm font-black uppercase tracking-tight text-white mb-1 truncate">${p.name}</p>
        <p class="text-sm font-black text-red">${formatPrice(p.price)}</p>
      `;
      grid.appendChild(card);
    });
  }

  function updateLoadMore(total) {
    const wrap = document.getElementById('load-more-wrap');
    const loaded = currentPage * PAGE_SIZE;
    if (loaded < total) {
      wrap.classList.remove('hidden');
    } else {
      wrap.classList.add('hidden');
    }
  }

  document.getElementById('load-more-btn').addEventListener('click', () => {
    currentPage++;
    loadProducts(false);
  });

  // ─── Search ───────────────────────────────────────────────────────────────
  document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      currentSearch = e.target.value.trim();
      loadProducts(true);
    }, 400);
  });

  // ─── Sort ─────────────────────────────────────────────────────────────────
  document.getElementById('sort-select').addEventListener('change', (e) => {
    const val = e.target.value;
    const grid = document.getElementById('products-grid');
    const cards = [...grid.children];

    cards.sort((a, b) => {
      const priceA = parseFloat(a.querySelector('.text-red').textContent.replace('£', ''));
      const priceB = parseFloat(b.querySelector('.text-red').textContent.replace('£', ''));
      return val === 'price_asc' ? priceA - priceB : priceB - priceA;
    });

    cards.forEach(c => grid.appendChild(c));
  });
</script>
</body>
</html>
