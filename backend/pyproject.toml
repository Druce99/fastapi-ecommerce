[project]
name = "fastapi-ecommerce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "fastapi>=0.133.1",
    "faststream[redis]>=0.6.7",
    "greenlet>=3.3.2",
    "gunicorn>=26.0.0",
    "itsdangerous>=2.2.0",
    "loguru>=0.7.3",
    "passlib>=1.7.4",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "sqladmin>=0.25.0",
    "sqlalchemy>=2.0.47",
    "uvicorn[standard]>=0.41.0",
    "yookassa>=3.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "bandit>=1.9.4",
    "radon>=6.0.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
# assert и тестовые пароли в тестах — норма
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
exclude = ["src/migrations/"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR"

[tool.bandit]
exclude_dirs = ["tests", "src/migrations"]
